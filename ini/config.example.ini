; Copy to:
; - ini/config_local.ini for local development
; - ini/config.ini for production

; =========================
; DATABASE
; =========================
host = 127.0.0.1
port = 3306
dbname = xqanto_cz_main
user = your_user
password = your_password
type = mysql

; =========================
; ADMIN SESSION
; =========================
user_admin =
password_admin =
project_session_name = QANTO_SHARED_SESSID
admin_session_namespace = qanto_admin

; =========================
; SMTP
; =========================
smtp_server = smtp.example.com
smtp_port = 465
smtp_secure = ssl
smtp_user = user@example.com
smtp_password = your_smtp_password
smtp_from = no-reply@example.com
smtp_from_name = Qanto shared admin
mail_bypass_enabled = 0
mail_bypass_email =

; =========================
; CRON
; =========================
cron_token = generate_a_random_secret_token

; =========================
; AI TRANSLATION
; =========================
; DeepL Free keys usually use https://api-free.deepl.com/v2/translate.
; DeepL Pro keys usually use https://api.deepl.com/v2/translate.
deepl_auth_key =
deepl_api_url =
deepl_target_lang = EN

; =========================
; NEWSLETTER / KLERK
; =========================
klerk_smtp_host = smtpx.stable.cz
klerk_smtp_port = 465
klerk_smtp_secure = ssl
klerk_smtp_user =
klerk_smtp_password =
klerk_smtp_from = no-reply@qanto.cz
klerk_smtp_from_name = Qanto
klerk_campaign_id =
newsletter_public_base_url = https://www.qanto.cz
newsletter_news_path = /cz/news/
newsletter_unsubscribe_url = https://www.qanto.cz/cz/newsletter/unsubscribe
newsletter_unsubscribe_secret =
newsletter_local_test_email =
newsletter_brand_name = Qanto
newsletter_logo_url = https://www.qanto.cz/img/design/logo_admin_login.png
newsletter_accent_color = #e30613
